[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prl-pipeline"
version = "0.1.0"
description = "PRL (Perilesional Rim Lesion) detection pipeline"
requires-python = ">=3.10"
dependencies = [
    "attrs",
    "click",
    "loguru",
    "matplotlib",
    "nibabel",
    "numpy",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "tqdm",
]

[project.scripts]
prl = "prl.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prl", "prl.*"]
namespaces = false

[tool.setuptools.package-data]
"prl.preprocessing" = ["concatImages.sh", "define_bounding_boxes.sh"]
"prl.scripts" = ["lst_ai.sh"]
